# CCTSystem refuses to start until these node identifiers are set.
network-id: cct-main
server-id: change-me
node-id: change-me

# Examples: proxy, network-authority, skin-authority, auth-authority,
# business-authority, points-authority, gameplay, economy-source
roles:
  - gameplay

database:
  enabled: false
  jdbc-url: ${CCTSYSTEM_DB_URL:-}
  username: ${CCTSYSTEM_DB_USER:-}
  password: ${CCTSYSTEM_DB_PASSWORD:-}
  maximum-pool-size: 6
  connection-timeout-ms: 5000

bridge:
  enabled: false
  url: ${CCTSYSTEM_BRIDGE_URL:-wss://api.cctstudio.cn/internal/minecraft/connect}
  secret: ${CCTSYSTEM_BRIDGE_SECRET:-}
  connect-timeout-seconds: 10
  request-timeout-seconds: 8

exchange:
  weekly-limit-points: 300
  timezone: Asia/Shanghai
  # Configure a source only on the server that owns that currency.
  # sources:
  #   - source-id: survival_coins
  #     server-id: survival
  #     currency-display-name: 生存金币
  #     currency-units-per-point: 100.00
  #     cap-group: global_currency_exchange
  #     enabled: true
  sources: []

membership:
  quote-ttl-seconds: 60
  max-purchase-days: 365
  purchase-blocked-groups: [helper, mod, admin, owner]
  tiers:
    - key: vip
      display-name: VIP
      priority: 100
      luck-perms-group: vip
      duration-days: 30
      price-points: 100
      upgrade-credit-rate-bps: 8000
      display-material: GOLD_INGOT
      benefits: [专属称号, 专属每日礼包 + 一次性礼包, 可开启 4 星神秘箱, 箱子商店数量 15 个, 1.2 倍金钱获取, 5 个领地，最大 300×300, 创造服 2 个地皮, 2 只宠物，1.5 倍升级, 切换 PVP 状态, 远程末影箱, 大厅飞行]
      enabled: true
    - key: vip_plus
      display-name: VIP+
      priority: 200
      luck-perms-group: vipp
      duration-days: 30
      price-points: 200
      upgrade-credit-rate-bps: 8000
      display-material: DIAMOND
      benefits: [包含VIP全部权益, 箱子商店数量 20 个, 1.5 倍金钱获取, 8 个领地，最大 400×400, 创造服 3 个地皮, 3 只宠物，2.0 倍升级, 解锁高级战令, 远程铁砧, 支持跨服喊话, 每日飞行消耗 500 点]
      enabled: true
    - key: mvp
      display-name: MVP
      priority: 300
      luck-perms-group: mvp
      duration-days: 30
      price-points: 400
      upgrade-credit-rate-bps: 8000
      display-material: EMERALD
      benefits: [包含VIP+全部权益, 可开启 5 星神秘箱, 箱子商店数量 25 个, 1.8 倍金钱获取, 12 个领地，最大 600×600, 创造服 4 个地皮, 4 只宠物，2.5 倍升级, 高级生物捕捉, 每日飞行消耗 2000 点]
      enabled: true
    - key: mvp_plus
      display-name: MVP+
      priority: 400
      luck-perms-group: mvpp
      duration-days: 30
      price-points: 800
      upgrade-credit-rate-bps: 8000
      display-material: NETHER_STAR
      benefits: [包含MVP全部权益, 箱子商店数量 30 个, 2.0 倍金钱获取, 20 个领地，最大 1000×1000, 创造服 5 个地皮, 5 只宠物，3.0 倍升级, 最大范围生物捕捉, 无限飞行, 骑乘装饰宠物, 彩色宠物名, 匿名功能]
      enabled: true

promotion:
  timezone: Asia/Shanghai

redeem-code:
  length: 12
  pepper: ${CCTSYSTEM_REDEEM_PEPPER:-}

modules:
  identity:
    enabled: auto
  auth:
    enabled: auto
  points:
    enabled: auto
  exchange:
    enabled: auto
  membership:
    enabled: auto
  promotion:
    enabled: auto
  redeem:
    enabled: auto
  skins:
    enabled: auto
  network-status:
    enabled: auto
