# 领取后会自动改为 claimed-material。命令由控制台执行，{player} 会替换为玩家名。
rewards:
  daily:
    reset-policy: DAILY
    cooldown-seconds: 86400
    permission: ""
    claimed-material: MINECART
    commands: ["mysterydust add {player} 10"]
  free:
    reset-policy: MONTHLY
    cooldown-seconds: 2592000
    permission: ""
    claimed-material: MINECART
    commands: ["gmysterybox give {player} 1"]
  vip:
    reset-policy: MONTHLY
    cooldown-seconds: 2592000
    permission: cctsystem.reward.vip
    claimed-material: MINECART
    commands: ["gmysterybox give {player} 5"]
  vipp:
    reset-policy: MONTHLY
    cooldown-seconds: 2592000
    permission: cctsystem.reward.vipp
    claimed-material: MINECART
    commands: ["gmysterybox give {player} 5"]
  mvp:
    reset-policy: MONTHLY
    cooldown-seconds: 2592000
    permission: cctsystem.reward.mvp
    claimed-material: MINECART
    commands: ["gmysterybox give {player} 5"]
  mvpp:
